# ──────────────────────────────────────────────────────────────────────────────
# app/frontend — GitLab CI
#
# Only main branch is deployed — to the prod cluster (manual trigger).
#
# Build config is baked via .env.production (committed to repo).
# No GitLab CI variables needed for Vite build — template doesn't pass them as build-args.
#
# Group-level variables (set at myapp group level):
#   YC_REGISTRY_ID, YC_SA_KEY, KUBECONFIG_PROD,
#   BW_SERVER_URL, BW_CLIENTID, BW_CLIENTSECRET, BW_PASSWORD, BW_CA_CERT,
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# ──────────────────────────────────────────────────────────────────────────────

variables:
  APP_NAME: app-frontend
  IMAGE_REPO: cr.yandex/$YC_REGISTRY_ID/app-frontend
  NAMESPACE_PROD: app
  HELM_VALUES_PROD: values-app-frontend-prod.yaml

include:
  - project: 'myapp/infra'
    ref: main
    file: '/gitlab-ci/templates/frontend.yml'

# ── Disable unused jobs ──────────────────────────────────────────────────────
deploy-dev:
  rules:
    - when: never

deploy-stage:
  rules:
    - when: never
