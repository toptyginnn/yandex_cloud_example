---
# ──────────────────────────────────────────────────────────────────────────────
# K8s Applications – Stage
#
# Prerequisites:
#   1. tofu apply ENV=stage  (creates K8s cluster)
#   2. make kubeconfig ENV=stage  (or: yc managed-kubernetes cluster get-credentials --id <id> --internal)
#
# Run:
#   ansible-playbook playbooks/k8s-apps-stage.yml
#   ansible-playbook playbooks/k8s-apps-stage.yml --tags nginx_ingress
#   ansible-playbook playbooks/k8s-apps-stage.yml --tags cert_manager
#   ansible-playbook playbooks/k8s-apps-stage.yml --tags cloudnative_pg
# ──────────────────────────────────────────────────────────────────────────────
- name: Deploy K8s applications to stage
  hosts: k8s_apps_stage
  gather_facts: false

  vars:
    env_name: stage

  roles:
    - role: nginx_ingress
      tags: [nginx_ingress, ingress]

    - role: cert_manager
      tags: [cert_manager]

    - role: cloudnative_pg
      tags: [cloudnative_pg, databases]

    - role: redis_k8s
      tags: [redis_k8s, databases]

    - role: temporal
      tags: [temporal]

    - role: vaultwarden
      tags: [vaultwarden]

    - role: keycloak
      tags: [keycloak]

    - role: monitoring
      tags: [monitoring]

    - role: loki
      tags: [loki, monitoring]
