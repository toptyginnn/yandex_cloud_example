---
# ── cert-manager via Helm ─────────────────────────────────────────────────────

- name: Add jetstack Helm repository
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: https://charts.jetstack.io
  become: false

- name: Create cert-manager namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ cert_manager_namespace }}"
    state: present
  become: false

- name: Install / upgrade cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: "{{ cert_manager_chart_version }}"
    release_namespace: "{{ cert_manager_namespace }}"
    create_namespace: true
    wait: true
    values:
      installCRDs: true
  become: false

- name: Wait for cert-manager webhook to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: cert-manager-webhook
    namespace: "{{ cert_manager_namespace }}"
  register: _webhook
  until: >-
    _webhook.resources | length > 0 and
    (_webhook.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 30
  delay: 10
  become: false

# ── ClusterIssuers ────────────────────────────────────────────────────────────

- name: Create SelfSigned bootstrap ClusterIssuer
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: "{{ cert_manager_selfsigned_issuer_name }}"
      spec:
        selfSigned: {}
  become: false

- name: Create internal root CA Certificate
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: "{{ cert_manager_ca_secret_name }}"
        namespace: "{{ cert_manager_namespace }}"
      spec:
        isCA: true
        commonName: internal-root-ca
        secretName: "{{ cert_manager_ca_secret_name }}"
        duration: 87600h   # 10 лет
        renewBefore: 720h  # 30 дней
        privateKey:
          algorithm: RSA
          size: 4096
        issuerRef:
          name: "{{ cert_manager_selfsigned_issuer_name }}"
          kind: ClusterIssuer
  become: false

- name: Wait for root CA Certificate to be ready
  kubernetes.core.k8s_info:
    api_version: cert-manager.io/v1
    kind: Certificate
    name: "{{ cert_manager_ca_secret_name }}"
    namespace: "{{ cert_manager_namespace }}"
  register: _ca_cert
  until: >-
    _ca_cert.resources | length > 0 and
    (_ca_cert.resources[0].status.conditions | default([]) |
     selectattr('type', 'equalto', 'Ready') |
     selectattr('status', 'equalto', 'True') | list | length) > 0
  retries: 30
  delay: 5
  become: false

- name: Create internal CA ClusterIssuer
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: "{{ cert_manager_ca_issuer_name }}"
      spec:
        ca:
          secretName: "{{ cert_manager_ca_secret_name }}"
  become: false

- name: Create Let's Encrypt staging ClusterIssuer
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: "{{ cert_manager_letsencrypt_staging_issuer_name }}"
      spec:
        acme:
          server: https://acme-staging-v02.api.letsencrypt.org/directory
          email: "{{ cert_manager_letsencrypt_email }}"
          privateKeySecretRef:
            name: letsencrypt-staging-key
          solvers:
            - http01:
                ingress:
                  ingressClassName: "{{ cert_manager_acme_ingress_class }}"
  when: cert_manager_letsencrypt_email != ""
  become: false

- name: Create Let's Encrypt production ClusterIssuer
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: "{{ cert_manager_letsencrypt_prod_issuer_name }}"
      spec:
        acme:
          server: https://acme-v02.api.letsencrypt.org/directory
          email: "{{ cert_manager_letsencrypt_email }}"
          privateKeySecretRef:
            name: letsencrypt-prod-key
          solvers:
            - http01:
                ingress:
                  ingressClassName: "{{ cert_manager_acme_ingress_class }}"
  when: cert_manager_letsencrypt_email != ""
  become: false

# ── Вывод CA сертификата для CI ───────────────────────────────────────────────

- name: Read internal root CA secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ cert_manager_ca_secret_name }}"
    namespace: "{{ cert_manager_namespace }}"
  register: _ca_secret
  become: false

- name: Show CA cert for GitLab CI variable BW_CA_CERT
  ansible.builtin.debug:
    msg: |
      === Add as GitLab CI variable BW_CA_CERT (type: File) ===
      {{ _ca_secret.resources[0].data['tls.crt'] | b64decode }}
