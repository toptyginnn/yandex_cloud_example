appName: app
component: frontend

image:
  repository: cr.yandex/REGISTRY_ID/app-frontend

port: 3000
secretName: ""

env:
  PORT: "3000"

ingress:
  enabled: true
  className: nginx-external
  host: app.myapp.example.com
  tls: true
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "5m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

replicaCount: 2
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

probes:
  startup:
    path: /health
    failureThreshold: 10
    periodSeconds: 5
  liveness:
    path: /health
    periodSeconds: 15
    failureThreshold: 3
  readiness:
    path: /health
    periodSeconds: 10
    failureThreshold: 3

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: app-frontend-prod
          topologyKey: kubernetes.io/hostname
